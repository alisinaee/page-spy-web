<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PageSpy Smoke Test</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        margin: 0;
        padding: 3rem 1.5rem;
        background: #f5f7fb;
        color: #172033;
      }

      main {
        max-width: 42rem;
        margin: 0 auto;
        padding: 2rem;
        border-radius: 1rem;
        background: #ffffff;
        box-shadow: 0 0.75rem 2rem rgb(30 50 90 / 10%);
      }

      button {
        margin-top: 1rem;
        padding: 0.75rem 1rem;
        border: 0;
        border-radius: 0.5rem;
        background: #3457d5;
        color: #ffffff;
        cursor: pointer;
        font: inherit;
      }

      code {
        background: #edf1f8;
        border-radius: 0.25rem;
        padding: 0.1rem 0.3rem;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>PageSpy smoke test</h1>
      <p>
        Connected panel: <code id="panel">Detecting...</code>
      </p>
      <p id="status">Loading PageSpy SDK...</p>
      <p>Click button, then inspect message in PageSpy Console panel.</p>
      <div style="display:flex; flex-direction:column; gap:8px; margin-top:1rem;">
        <div style="display:flex; gap:8px; flex-wrap:wrap;">
          <button id="send" type="button">Send test log</button>
          <button id="generate" type="button">Generate basic logs</button>
          <button id="open-modal-test" type="button" onclick="if(window.PageSpyModal)PageSpyModal.show()" style="background:#6d28d9;">Open PageSpy Dialog</button>
          <button id="open-client-logs" type="button" onclick="if(window.PageSpyClientLogs)PageSpyClientLogs.openViewer()" style="background:#4338ca;">See Device Logs</button>
        </div>
        <div style="display:flex; gap:8px; flex-wrap:wrap;">
          <button id="load-sample-logs" type="button" style="background:#059669;">Load KYC Session</button>
          <button id="load-loan-logs" type="button" style="background:#0284c7;">Load d340 Loan Session</button>
          <button id="load-fa82-logs" type="button" style="background:#dc2626;">Load fa82 Error Session</button>
          <button id="load-all-logs" type="button" style="background:#4f46e5;">Load All Real Sessions</button>
        </div>
      </div>
      <div id="page-marker"></div>
    </main>

    <script type="module" src="./client-logs.js?v=11"></script>
    <script type="module">
      PageSpyClientLogs.install();

      const panel = new URLSearchParams(location.search).get('panel') || '6753';
      const panelUrl = location.protocol + '//' + location.hostname + ':' + panel;
      const project = panel === '6753' ? 'local-fork-test' : 'official-test';

      document.querySelector('#panel').textContent = panelUrl;

      const script = document.createElement('script');
      script.crossOrigin = 'anonymous';
      script.src = panelUrl + '/page-spy/index.min.js';
      script.onerror = () => {
        document.querySelector('#status').textContent = 'PageSpy SDK failed to load.';
      };
      script.onload = () => {
        try {
          window.$pageSpy = new PageSpy({
            api: location.hostname + ':' + panel,
            clientOrigin: panelUrl,
            project: project,
            lang: 'en',
          });
          PageSpyClientLogs.mountDialogActions();
          document.querySelector('#status').textContent = 'PageSpy SDK loaded. Check panel connection.';
          if (new URLSearchParams(location.search).get('autoload') === '1') {
            setTimeout(loadKycLogs, 600);
            setTimeout(() => {
              if (window.$pageSpy && window.$pageSpy.constructor && window.$pageSpy.constructor.modal) {
                window.$pageSpy.constructor.modal.show();
              }
            }, 1200);
          }
          console.log('PageSpy connected', { panel: panelUrl, project: project });
        } catch (error) {
          document.querySelector('#status').textContent = 'PageSpy initialization failed: ' + error.message;
          throw error;
        }
      };
      document.head.appendChild(script);

      
      async function injectSessionData(endpoint, sessionName) {
        document.querySelector('#status').textContent = 'Loading ' + sessionName + '...';
        try {
          const res = await fetch(endpoint);
          if (!res.ok) throw new Error('HTTP ' + res.status);
          const data = await res.json();

          // 1. Console logs
          if (Array.isArray(data.console)) {
            const sampleLogs = data.console
              .map((item) => {
                const line = (item.logs || [])
                  .map((l) => {
                    if (typeof l.value === 'string') return l.value;
                    if (l.value === 0 || l.value === false) return String(l.value);
                    return l.value ? JSON.stringify(l.value) : '';
                  })
                  .filter((part) => part !== '')
                  .join(' ');
                return { item, line };
              })
              .filter((entry) => entry.line.trim())
              .slice(0, 400);
            sampleLogs.forEach(({ item, line }) => {
              const level = item.logType || 'log';
              if (console[level]) console[level](line);
              else console.log(line);
            });
          }

          // 2. Network logs
          if (Array.isArray(data.network)) {
            data.network.forEach((net) => {
              if (window.$pageSpy && window.$pageSpy.socketStore) {
                const msg = { role: 'client', type: 'network', data: net };
                try {
                  window.$pageSpy.socketStore.dispatchEvent('public-data', msg);
                  window.$pageSpy.socketStore.broadcastMessage(msg, false);
                } catch (e) {}
              }
              if (window.PageSpyClientLogs && window.PageSpyClientLogs.record) {
                let respObj = net.response;
                try {
                  if (
                    typeof respObj === 'string' &&
                    (respObj.startsWith('{') || respObj.startsWith('['))
                  ) {
                    respObj = JSON.parse(respObj);
                  }
                } catch (e) {}

                window.PageSpyClientLogs.record({
                  section: 'network',
                  id: net.id,
                  method: net.method,
                  url: net.url,
                  status: net.status,
                  costTime: net.costTime,
                  requestHeaders: net.requestHeader,
                  requestBody: net.requestPayload,
                  responseHeaders: net.responseHeader,
                  responseBody: respObj,
                });
              }
            });
          }
          // 3. Storage logs
          if (data.storage) {
            ['localStorage', 'sessionStorage'].forEach((stType) => {
              const entries = data.storage[stType];
              if (entries) {
                const list = Array.isArray(entries)
                  ? entries
                  : Object.entries(entries).map(([name, value]) => ({ name, value }));
                list.forEach((item) => {
                  try {
                    if (stType === 'localStorage') localStorage.setItem(item.name, typeof item.value === 'string' ? item.value : JSON.stringify(item.value));
                    else sessionStorage.setItem(item.name, typeof item.value === 'string' ? item.value : JSON.stringify(item.value));
                  } catch (e) {}
                  if (window.$pageSpy && window.$pageSpy.socketStore) {
                    const sMsg = {
                      role: 'client',
                      type: 'storage',
                      data: {
                        id: Math.random().toString(36).slice(2),
                        type: stType,
                        action: 'set',
                        name: item.name,
                        value: typeof item.value === 'string' ? item.value : JSON.stringify(item.value),
                      },
                    };
                    try {
                      window.$pageSpy.socketStore.dispatchEvent('public-data', sMsg);
                      window.$pageSpy.socketStore.broadcastMessage(sMsg, false);
                    } catch (e) {}
                  }
                });
              }
            });
          }
          document.querySelector('#status').textContent =
            sessionName + ' loaded (' + (data.network?.length || 0) + ' requests, storage synced).';
        } catch (err) {
          document.querySelector('#status').textContent =
            'Failed loading ' + sessionName + ': ' + err.message;
        }
      }

      const loadKycLogs = () => injectSessionData('/data/kyc.json', 'KYC Real Session');
      const loadLoanLogs = () => injectSessionData('/data/d340.json', 'd340 Loan Session');
      const loadFa82Logs = () => injectSessionData('/data/fa82.json', 'fa82 Error Session');
      const loadAllLogs = async () => {
        if (window.PageSpyClientLogs && window.PageSpyClientLogs.clear) {
          window.PageSpyClientLogs.clear();
        }
        await loadKycLogs();
        await loadLoanLogs();
        await loadFa82Logs();
      };

      document.querySelector('#load-sample-logs').addEventListener('click', loadKycLogs);
      document.querySelector('#load-loan-logs').addEventListener('click', loadLoanLogs);
      document.querySelector('#load-fa82-logs').addEventListener('click', loadFa82Logs);
      document.querySelector('#load-all-logs').addEventListener('click', loadAllLogs);
      document.querySelector('#send').addEventListener('click', () => {
        console.log('PageSpy test log', { time: new Date().toISOString() });
      });
      document.querySelector('#generate').addEventListener('click', () => {
        console.log('basic log');
        console.info('basic info');
        console.warn('basic warn');
        console.error('basic error');
      });
      document.querySelector('#open-client-logs').addEventListener('click', () => {
        if (window.PageSpyClientLogs && window.PageSpyClientLogs.openViewer) {
          window.PageSpyClientLogs.openViewer();
        }
      });
      document.querySelector('#open-modal-test').addEventListener('click', () => {
        if (window.PageSpyModal) {
          window.PageSpyModal.show();
        } else if (window.$pageSpy && window.$pageSpy.constructor && window.$pageSpy.constructor.modal) {
          window.$pageSpy.constructor.modal.show();
        } else {
          document.querySelector('.page-spy-logo')?.click();
        }
      });
    </script>
  </body>
</html>
